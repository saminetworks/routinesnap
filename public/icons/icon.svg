<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed brand gradient. Keep the mark centred with generous
       margins so the icon stays legible at 48px and smaller. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Calendar body -->
  <rect x="106" y="128" width="300" height="272" rx="36" fill="#FFFFFF"/>
  <!-- Calendar header strip -->
  <path d="M106 164 a36 36 0 0 1 36 -36 h228 a36 36 0 0 1 36 36 v28 H106 Z" fill="#6366F1"/>
  <!-- Binder rings -->
  <rect x="156" y="100" width="30" height="56" rx="15" fill="#FFFFFF"/>
  <rect x="326" y="100" width="30" height="56" rx="15" fill="#FFFFFF"/>
  <!-- Grid of schedule blocks -->
  <rect x="138" y="216" width="64" height="64" rx="14" fill="#6366F1"/>
  <rect x="224" y="216" width="64" height="64" rx="14" fill="#C7D2FE"/>
  <rect x="310" y="216" width="64" height="64" rx="14" fill="#10B981"/>
  <rect x="138" y="304" width="64" height="64" rx="14" fill="#DDD6FE"/>
  <rect x="224" y="304" width="64" height="64" rx="14" fill="#8B5CF6"/>
  <rect x="310" y="304" width="64" height="64" rx="14" fill="#C7D2FE"/>
  <!-- Reminder dot: emerald circle with a white check -->
  <circle cx="392" cy="388" r="46" fill="#10B981" stroke="#FFFFFF" stroke-width="10"/>
  <path d="M372 388 l14 14 l26 -30" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
