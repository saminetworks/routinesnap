<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed brand gradient. Keep the mark centred with generous
       margins so the icon stays legible at 48px and smaller. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Camera body -->
  <rect x="96" y="192" width="320" height="192" rx="48" fill="#FFFFFF"/>
  <!-- Viewfinder bump -->
  <rect x="192" y="144" width="128" height="64" rx="24" fill="#FFFFFF"/>
  <!-- Lens: indigo circle with a white ring and a 2x2 calendar grid -->
  <circle cx="256" cy="288" r="68" fill="#6366F1"/>
  <circle cx="256" cy="288" r="68" fill="none" stroke="#FFFFFF" stroke-width="12"/>
  <rect x="232" y="264" width="21" height="21" rx="5" fill="#FFFFFF"/>
  <rect x="259" y="264" width="21" height="21" rx="5" fill="#FFFFFF"/>
  <rect x="232" y="291" width="21" height="21" rx="5" fill="#FFFFFF"/>
  <rect x="259" y="291" width="21" height="21" rx="5" fill="#FFFFFF"/>
  <!-- Flash dot -->
  <circle cx="360" cy="232" r="14" fill="#6366F1"/>
</svg>
